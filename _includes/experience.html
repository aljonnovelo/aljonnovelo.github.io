<section class="section experience" id="experience">
  <div class="section__content">
    <a href="https://www.i-bridge.com.ph/" target="_blank">
      <img src="{{site.baseurl}}/img/experience/ibridge.png" alt="">
    </a>
    <div class="jobs">
      {% for job in site.data.experience %}
      <div class="job">
        <div class="time-place">
          <div class="job__company-position">
            <span class="job__company">
              <a href="{{job.url}}" class="underline-link" target="_blank">{{job.company}}</a>
            </span>
            <span class="job__position"> | {{job.position}}</span>
          </div>
          <div class="job__time">{{job.time}}</div>
        </div>
        <div class="job__activities">
          <ul>
            {% for activity in job.activities %}
            <li>• {{activity}}</li>
            {% endfor %}
          </ul>
        </div>
      {% endfor %}
    </div>
    <a href="{{site.resume}}" target="_blank" class="underline-link">View my Resume!</a>
  </div>
</section>
